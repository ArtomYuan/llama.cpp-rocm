name: 💡 功能请求（Feature Request）
description: 建议新功能或改进（新量化格式、视觉能力、性能优化等）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！提交前请先搜索现有 issue 和讨论，确认没有被提出过。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能要解决什么问题？你遇到了什么痛点或限制？
      placeholder: 例如：当前 Q3_0_ROCMFPX 在长上下文下质量下降明显，希望有质量优先的变体
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望如何实现？（尽量具体：新的量化类型、参数、API、命令等）
      placeholder: 例如：新增 Q3_0_ROCMFPX_STRIX 变体，K/V 使用更高精度布局
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你还考虑过哪些替代方案？为什么它们不够好？
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 相关模型、实测数据、参考实现、上游 issue 等任何有助于评估的信息
